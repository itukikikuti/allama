# Windows 版の .exe を、本物の Windows（GitHub の runner）で組む。
# クロの手元は Linux で wine も無いので、Windows の .exe はここでしか作れない。
#
# 手で回す: Actions の「windows」→ Run workflow
# タグを押したとき: 組んだ .exe をリリースにも付ける（v0.1.0 など）

name: windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: 本体の依存と画面
        run: |
          npm ci
          npm run build

      - name: 窓の依存（Electron）
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: 同梱する Node（win-x64）
        shell: pwsh
        run: |
          $ver = 'v24.21.0'
          Invoke-WebRequest "https://nodejs.org/dist/$ver/node-$ver-win-x64.zip" -OutFile node.zip
          Expand-Archive node.zip -DestinationPath vendor-tmp -Force
          New-Item -ItemType Directory -Force vendor | Out-Null
          Copy-Item "vendor-tmp\node-$ver-win-x64" vendor\node -Recurse -Force

      - name: 組み立て
        working-directory: desktop
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: allama-win-x64
          path: |
            dist-desktop/*.exe
            dist-desktop/*.zip
          if-no-files-found: error

      - name: リリースに付ける
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-desktop/*.exe
            dist-desktop/*.zip
