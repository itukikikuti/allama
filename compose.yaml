services:
  atama:
    build: .
    image: atama
    container_name: atama
    init: true
    restart: unless-stopped
    ports:
      - "3170:3170"
    volumes:
      - ./docker/config.json:/app/docker/config.json:ro
      - atama-data:/home/node/.atama # 記憶・セッションの記録・タスク
      - claude-home:/home/node/.claude # Claude Code の設定と会話（続きの再開に必要）
      - work:/home/node/work # 手の既定の作業フォルダ
    depends_on:
      - ollama

  # atama からだけ使う Ollama（外には公開しない）。
  # クラウドモデルを使うには一度だけ `docker exec -it atama-ollama ollama signin` が必要。
  ollama:
    image: ollama/ollama:latest
    container_name: atama-ollama
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama

volumes:
  atama-data:
  claude-home:
  work:
  ollama:
