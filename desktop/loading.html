<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:" />
    <title>allama</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-items: center;
        background: #faf9f5;
        color: #3d3a34;
        font: 15px/1.7 system-ui, "Yu Gothic UI", "Meiryo", sans-serif;
      }
      main {
        text-align: center;
        max-width: 30em;
        padding: 2em;
      }
      .eye {
        width: 44px;
        height: 44px;
        margin: 0 auto 1.2em;
        border-radius: 10px;
        background: #c96442;
        position: relative;
      }
      .eye::before,
      .eye::after {
        content: "";
        position: absolute;
        top: 17px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #faf9f5;
      }
      .eye::before {
        left: 12px;
      }
      .eye::after {
        right: 12px;
      }
      p {
        margin: 0.4em 0;
        white-space: pre-wrap;
      }
      #status {
        color: #7a736a;
      }
      .blink {
        animation: blink 1.4s ease-in-out infinite;
      }
      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="eye"></div>
      <p id="status" class="blink">allama を起こしています…</p>
    </main>
    <script>
      window.setStatus = (text) => {
        const el = document.getElementById('status');
        el.textContent = text;
        el.classList.toggle('blink', text.startsWith('allama を起こして'));
      };
    </script>
  </body>
</html>
