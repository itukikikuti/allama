<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:" />
    <title>allama</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-items: center;
        background: #faf9f5;
        color: #3d3a34;
        font: 15px/1.7 system-ui, "Yu Gothic UI", "Meiryo", sans-serif;
      }
      main {
        text-align: center;
        max-width: 30em;
        padding: 2em;
      }
      svg.face {
        display: block;
        width: 52px;
        height: 52px;
        margin: 0 auto 1.2em;
      }
      p {
        margin: 0.4em 0;
        white-space: pre-wrap;
      }
      #status {
        color: #7a736a;
      }
      .blink {
        animation: blink 1.4s ease-in-out infinite;
      }
      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <svg class="face" viewBox="0 0 64 64" role="img" aria-label="allama">
        <rect width="64" height="64" rx="14" fill="#c96442" />
        <circle cx="32" cy="30" r="14" fill="none" stroke="#faf9f5" stroke-width="4" />
        <circle cx="26.5" cy="29" r="2.4" fill="#faf9f5" />
        <circle cx="37.5" cy="29" r="2.4" fill="#faf9f5" />
        <path d="M27.5 35c1.2 2.4 2.7 3.7 4.5 3.7s3.3-1.3 4.5-3.7" fill="none" stroke="#faf9f5" stroke-width="4" stroke-linecap="round" />
      </svg>
      <p id="status" class="blink">allama を起こしています…</p>
    </main>
    <script>
      window.setStatus = (text) => {
        const el = document.getElementById('status');
        el.textContent = text;
        el.classList.toggle('blink', text.startsWith('allama を起こして'));
      };
    </script>
  </body>
</html>
